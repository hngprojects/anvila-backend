target-version = "py312"
line-length = 100

[lint]
select = [
    "E9",
    "F821",
    "F823",
    "E",
    "F",
    "I",
    "B",
    "UP"
]
ignore = []
exclude = [
    "tests/*",
    "test_*.py",
    "scripts/get-pip.py",
    "allure/*",
    "docs/*",
    "examples/*",
    "build/*",
    "dist/*",
    "venv/*",
    "alembic/*"
]
