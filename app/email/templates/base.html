<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ANVILA{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f0f4f4;font-family:'Segoe UI',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f4f4;padding:48px 0;">
    <tr>
      <td align="center">
        <table width="520" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:12px;overflow:hidden;
                      box-shadow:0 4px 24px rgba(0,95,90,.10);">

          <!-- Header -->
          <tr>
            <td style="background:#005f5a;padding:36px 40px;text-align:center;">
              <span style="color:#ffffff;font-size:18px;font-weight:800;">ANVILA</span>
              <h1 style="margin:16px 0 0;color:#ffffff;font-size:22px;font-weight:700;line-height:1.3;">
                {% block heading %}{% endblock %}
              </h1>
            </td>
          </tr>
          <tr><td style="background:#004744;height:3px;font-size:0;">&nbsp;</td></tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #e5e7eb;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;text-align:center;">
              {% block footer %}
              <p style="margin:0;color:#9ca3af;font-size:12px;line-height:1.7;">
                Sent to <strong style="color:#6b7280;">{{ email }}</strong>
              </p>
              {% endblock %}
            </td>
          </tr>

          <!-- Brand bar -->
          <tr>
            <td style="background:#f9fafb;border-top:1px solid #e5e7eb;
                        padding:16px 40px;text-align:center;">
              <p style="margin:0;color:#9ca3af;font-size:11px;">
                © 2025 ANVILA. All rights reserved.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
