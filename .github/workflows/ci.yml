name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    env:
      DB_TYPE: postgresql
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_URL: postgresql://ci:ci@localhost:5432/ci
      MYSQL_DRIVER: ""

      SECRET_KEY: ci-only-not-a-real-secret-do-not-reuse
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_EXPIRY: 7

      MAIL_USERNAME: ci-noreply@example.com
      MAIL_PASSWORD: ci-mail-not-a-real-password
      MAIL_FROM: ci-noreply@example.com
      MAIL_PORT: 587
      MAIL_SERVER: smtp.example.invalid

      FLUTTERWAVE_SECRET: ci-flw-not-real
      TWILIO_ACCOUNT_SID: ci-twilio-sid-not-real
      TWILIO_AUTH_TOKEN: ci-twilio-token-not-real
      TWILIO_PHONE_NUMBER: "+10000000000"

      APP_NAME: anvila-backend-ci
      TELEX_WEBHOOK_URL: https://example.invalid/telex

      GOOGLE_CLIENT_ID: ci-google-client-not-real
      GOOGLE_CLIENT_SECRET: ci-google-secret-not-real
      FRONTEND_URL: http://localhost:3000

      TESTING: "TEST"
      ENABLE_INSECURE_TEST_ENDPOINTS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov==7.1.0

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v --cov=api
