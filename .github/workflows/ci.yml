name: CI

on:
  push:
    branches: [staging, main, dev]
  pull_request:
    branches: [staging, main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up environment
        run: echo "${{ secrets.STAGING_ENV_BASE64 }}" | base64 -d > .env

      - name: Run tests
        run: |
          uv run pytest tests/ -v
          code=$?
          if [ $code -eq 5 ]; then
            exit 0
          else
            exit $code
          fi
