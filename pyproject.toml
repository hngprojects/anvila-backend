[project]
name = "anvila-backend"
version = "0.1.0"
description = "Backend service for Anvila, a platform for creating AI persona."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "pwdlib[argon2]>=0.3.0",
    "sib-api-v3-sdk>=7.6.0",
    "python-decouple>=3.8",
    "prometheus-client>=0.22.1",
    "celery>=5.6.3",
    "pdfplumber>=0.11.0",
    "docx2txt>=0.8",
    "redis>=5.0,<8.0",
    "google-genai>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
    "pytest-mock>=3.14.0",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
