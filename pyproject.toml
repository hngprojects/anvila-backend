[project]
name = "anvila-backend"
version = "0.1.0"
description = "FastAPI backend for Anvila"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.11",
    "aiohttp-retry>=2.8.3",
    "aiosmtplib>=2.0.2",
    "alembic>=1.13.2",
    "authlib>=1.3.1",
    "bcrypt>=4.1.3",
    "bleach>=6.1.0",
    "cryptography>=44.0.1",
    "email-validator>=2.2.0",
    "faker>=26.0.0",
    "fastapi>=0.111.1",
    "fastapi-mail>=1.4.1",
    "geoip2>=5.0.1",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pillow>=10.4.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "pyjwt>=2.8.0",
    "pyotp>=2.9.0",
    "python-dateutil>=2.9.0",
    "python-decouple>=3.8",
    "python-dotenv>=1.0.1",
    "python-jose>=3.4.0",
    "python-multipart>=0.0.9",
    "pytz>=2024.1",
    "qrcode>=8.0",
    "requests>=2.32.3",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.31",
    "stripe>=10.7.0",
    "twilio>=9.2.3",
    "ua-parser>=1.0.1",
    "user-agents>=2.2.0",
    "uuid7>=0.1.0",
    "uvicorn>=0.30.3",
    "uvloop>=0.19.0",
    "itsdangerous>=2.2.0",
    "premailer>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.8",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

